<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Moses Lenana" />
    
    <!-- Main Meta Tags -->
    <meta
      name="description"
      content="Portfolio of Moses Lenana - A talented designer showcasing projects and visions."
    />
    <meta
      name="keywords"
      content="Moses Lenana, portfolio, developer, designer, projects, skills"
    />

    <!-- Favicon and Apple Touch Icon -->
    <link rel="icon" href="/assets/moses3Logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Language Specific Meta Tags -->
    <meta
      name="description"
      lang="it"
      content="Portfolio di Moses Lenana - Un talentuoso sviluppatore e designer che mostra progetti e competenze."
    />
    <meta
      name="keywords"
      lang="it"
      content="Moses Lenana, portfolio, sviluppatore, designer, progetti, competenze"
    />

    <!-- Alternate Language Links -->
    <link rel="alternate" hreflang="en" href="https://example.com/en" />
    <link rel="alternate" hreflang="it" href="https://example.com/it" />

    <!-- Open Graph Meta Tags (for social sharing) -->
    <meta property="og:title" content="Moses Lenana | Portfolio" />
    <meta property="og:description" content="Portfolio of Moses Lenana - A talented designer showcasing projects and visions." />
    <meta property="og:image" content="/assets/moses3Logo.png" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@MosesLenana" />
    <meta name="twitter:title" content="Moses Lenana | Portfolio" />
    <meta name="twitter:description" content="Portfolio of Moses Lenana - A talented designer showcasing projects and visions." />
    <meta name="twitter:image" content="/assets/moses3Logo.png" />

    <!-- Title -->
    <title>Moses Lakei Lenana</title>
